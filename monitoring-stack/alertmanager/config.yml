# Cau hinh Alertmanager gui tin nhan ve Telegram
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'node']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-alerts'

receivers:
  - name: 'telegram-alerts'
    telegram_configs:
      - bot_token: 'THAY_BANG_BOT_TOKEN_TELEGRAM'
        chat_id: 123456789 # Thay bang chat id telegram cua ban
        send_resolved: true
        message: "<b>[{{ .Status | toUpper }}] CANH BAO HA TANG PROXMOX</b>\nTen loi: {{ .CommonLabels.alertname }}\nChi tiet: {{ .CommonAnnotations.summary }}\nMuc do: {{ .CommonLabels.severity }}"
